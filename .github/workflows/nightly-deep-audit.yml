name: Nightly Repository Deep Audit
on:
  workflow_dispatch:
  schedule:
    - cron: "51 19 * * *"
permissions:
  contents: read
jobs:
  repository-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run repository guards
        run: |
          python .github/scripts/regression_guard.py --base "$(git rev-parse HEAD^)"
          python .github/scripts/migration_state_guard.py
          python -m compileall -q apps/api storyboard-system/fastapi_app storyboard-system/repositories storyboard-system/tools
  dependency-manifest-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - working-directory: storyboard-system
        run: npm ci --workspaces=false
