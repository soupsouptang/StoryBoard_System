name: VNext Browser QA

on:
  schedule:
    - cron: "30 18 * * *"
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "apps/api/app/api/v1/auth.py"
      - "apps/api/app/api/v1/productions.py"
      - "apps/api/app/api/v1/shots.py"
      - "apps/api/app/api/v1/exports.py"
      - "apps/api/app/services/exporter.py"
      - "packages/ui/**"
      - "packages/types/**"
      - "packages/contracts/**"
      - "packages/timecode/**"
      - "package.json"
      - "package-lock.json"
      - "storyboard-system/package.json"
      - "storyboard-system/package-lock.json"
      - ".github/scripts/vnext_ui_qa.cjs"
      - ".github/workflows/vnext-browser-qa.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/web/**"
      - "apps/api/app/api/v1/auth.py"
      - "apps/api/app/api/v1/productions.py"
      - "apps/api/app/api/v1/shots.py"
      - "apps/api/app/api/v1/exports.py"
      - "apps/api/app/services/exporter.py"
      - "packages/ui/**"
      - "packages/types/**"
      - "packages/contracts/**"
      - "packages/timecode/**"
      - "package.json"
      - "package-lock.json"
      - "storyboard-system/package.json"
      - "storyboard-system/package-lock.json"
      - ".github/scripts/vnext_ui_qa.cjs"
      - ".github/workflows/vnext-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  ENVIRONMENT: "test"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
  PYTHONUNBUFFERED: "1"

jobs:
  browser:
    name: Responsive real-browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            storyboard-system/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r apps/api/requirements.txt
          npm ci
          npm ci --prefix storyboard-system --workspaces=false
      - name: Install Playwright Chromium
        working-directory: storyboard-system
        run: npx playwright install --with-deps chromium
      - name: Configure isolated VNext database
        run: |
          echo "DATABASE_URL=sqlite+aiosqlite:///$RUNNER_TEMP/frameforge-vnext-ui.db" >> "$GITHUB_ENV"
          echo "DATABASE_SYNC_URL=sqlite:///$RUNNER_TEMP/frameforge-vnext-ui.db" >> "$GITHUB_ENV"
      - name: Build VNext web
        run: |
          npm run build --workspace=@frameforge/contracts
          npm run build --workspace=@frameforge/timecode
          npm run build --workspace=@frameforge/types
          npm run build --workspace=@frameforge/ui
          npm run build --workspace=@frameforge/web
      - name: Start isolated API and Web
        shell: bash
        run: |
          mkdir -p qa-artifacts/vnext-ui
          python -m uvicorn main:app --app-dir apps/api --host 127.0.0.1 --port 8000 > qa-artifacts/vnext-ui/api.log 2>&1 &
          echo $! > qa-artifacts/vnext-ui/api.pid
          npm run start --workspace=@frameforge/web > qa-artifacts/vnext-ui/web.log 2>&1 &
          echo $! > qa-artifacts/vnext-ui/web.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "VNext services did not become ready" >&2
          exit 1
      - name: Run browser QA at 1440/1024/768/375/320
        run: node .github/scripts/vnext_ui_qa.cjs
      - name: Stop isolated services
        if: always()
        run: |
          test -f qa-artifacts/vnext-ui/api.pid && kill "$(cat qa-artifacts/vnext-ui/api.pid)" || true
          test -f qa-artifacts/vnext-ui/web.pid && kill "$(cat qa-artifacts/vnext-ui/web.pid)" || true
      - name: Upload screenshots and service logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vnext-browser-qa-${{ github.run_id }}
          path: qa-artifacts/vnext-ui
          retention-days: 7
