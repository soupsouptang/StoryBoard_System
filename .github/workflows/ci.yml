name: FRAMEFORGE CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ENVIRONMENT: "test"
  NEXT_TELEMETRY_DISABLED: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  architecture-boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run architecture boundary gate
        run: python storyboard-system/tools/architecture_boundary_gate.py

  vnext-backend:
    name: VNext API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
      - name: Run API contract tests
        run: |
          mkdir -p qa-artifacts/ci
          python -m pytest tests/backend -q --junitxml=qa-artifacts/ci/vnext-backend.xml
      - name: Upload API test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vnext-api-${{ github.sha }}
          path: qa-artifacts/ci/vnext-backend.xml
          if-no-files-found: warn
          retention-days: 14

  vnext-web:
    name: VNext Web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install monorepo dependencies
        run: npm ci
      - name: Build shared packages
        run: |
          npm run build --workspace=@frameforge/contracts
          npm run build --workspace=@frameforge/timecode
          npm run build --workspace=@frameforge/types
          npm run build --workspace=@frameforge/ui
      - name: Build Next.js application
        run: |
          mkdir -p qa-artifacts/ci
          set -o pipefail
          npm run build --workspace=@frameforge/web 2>&1 | tee qa-artifacts/ci/vnext-web-build.log
      - name: Upload VNext Web build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vnext-web-${{ github.sha }}
          path: qa-artifacts/ci/vnext-web-build.log
          if-no-files-found: warn
          retention-days: 14

  legacy-python:
    name: Legacy Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: storyboard-system/requirements.txt
      - name: Install Legacy Python dependencies
        working-directory: storyboard-system
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Create isolated Legacy data root
        run: |
          mkdir -p "$RUNNER_TEMP/frameforge-legacy-data"
          echo "STORYBOARD_DATA_ROOT=$RUNNER_TEMP/frameforge-legacy-data" >> "$GITHUB_ENV"
      - name: Run Legacy Python regression
        working-directory: storyboard-system
        shell: bash
        run: |
          mkdir -p ../qa-artifacts/ci
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee ../qa-artifacts/ci/legacy-python.log
      - name: Upload Legacy Python evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-python-${{ github.sha }}
          path: qa-artifacts/ci/legacy-python.log
          if-no-files-found: warn
          retention-days: 14

  legacy-web:
    name: Legacy workspace typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: storyboard-system/package-lock.json
      - name: Install Legacy frontend dependencies
        working-directory: storyboard-system
        run: npm ci --workspaces=false
      - name: Typecheck and build Legacy workspace
        working-directory: storyboard-system
        shell: bash
        run: |
          mkdir -p ../qa-artifacts/ci
          set -o pipefail
          npm run check 2>&1 | tee ../qa-artifacts/ci/legacy-web-build.log
      - name: Upload Legacy Web build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-web-${{ github.sha }}
          path: qa-artifacts/ci/legacy-web-build.log
          if-no-files-found: warn
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - architecture-boundaries
      - vnext-backend
      - vnext-web
      - legacy-python
      - legacy-web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture-boundaries.result }}
          BACKEND_RESULT: ${{ needs.vnext-backend.result }}
          WEB_RESULT: ${{ needs.vnext-web.result }}
          LEGACY_PY_RESULT: ${{ needs.legacy-python.result }}
          LEGACY_WEB_RESULT: ${{ needs.legacy-web.result }}
        run: |
          printf 'architecture=%s\nbackend=%s\nweb=%s\nlegacy-python=%s\nlegacy-web=%s\n' \
            "$ARCHITECTURE_RESULT" "$BACKEND_RESULT" "$WEB_RESULT" "$LEGACY_PY_RESULT" "$LEGACY_WEB_RESULT"
          test "$ARCHITECTURE_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$LEGACY_PY_RESULT" = "success"
          test "$LEGACY_WEB_RESULT" = "success"
