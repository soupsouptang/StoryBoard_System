name: FRAMEFORGE CI

on:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "tools/**"
      - "storyboard-system/src/**"
      - "storyboard-system/packages/**"
      - "storyboard-system/tests/**"
      - "storyboard-system/tools/**"
      - "storyboard-system/*.py"
      - "storyboard-system/package.json"
      - "storyboard-system/package-lock.json"
      - "storyboard-system/requirements*.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "tools/**"
      - "storyboard-system/src/**"
      - "storyboard-system/packages/**"
      - "storyboard-system/tests/**"
      - "storyboard-system/tools/**"
      - "storyboard-system/*.py"
      - "storyboard-system/package.json"
      - "storyboard-system/package-lock.json"
      - "storyboard-system/requirements*.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ENVIRONMENT: "test"
  NEXT_TELEMETRY_DISABLED: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  architecture-boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run architecture boundary gate
        run: python storyboard-system/tools/architecture_boundary_gate.py
      - name: Enforce canonical root packages
        run: python tools/package_boundary_gate.py

  vnext-backend:
    name: VNext API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
      - name: Run API contract tests
        run: python -m pytest tests/backend -q

  vnext-web:
    name: VNext Web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install monorepo dependencies
        run: npm ci
      - name: Build shared packages
        run: |
          npm run build --workspace=@frameforge/contracts
          npm run build --workspace=@frameforge/timecode
          npm run build --workspace=@frameforge/types
          npm run build --workspace=@frameforge/ui
      - name: Build Next.js application
        run: npm run build --workspace=@frameforge/web

  legacy-python:
    name: Legacy Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: storyboard-system/requirements.txt
      - name: Install Legacy Python dependencies
        working-directory: storyboard-system
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Create isolated Legacy data root
        run: |
          mkdir -p "$RUNNER_TEMP/frameforge-legacy-data"
          echo "STORYBOARD_DATA_ROOT=$RUNNER_TEMP/frameforge-legacy-data" >> "$GITHUB_ENV"
      - name: Run Legacy Python regression
        working-directory: storyboard-system
        run: python -m unittest discover -s tests -p "test_*.py" -v

  legacy-web:
    name: Legacy workspace typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: storyboard-system/package-lock.json
      - name: Install Legacy frontend dependencies
        working-directory: storyboard-system
        run: npm ci --workspaces=false
      - name: Typecheck and build Legacy workspace
        working-directory: storyboard-system
        run: npm run check

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - architecture-boundaries
      - vnext-backend
      - vnext-web
      - legacy-python
      - legacy-web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture-boundaries.result }}
          BACKEND_RESULT: ${{ needs.vnext-backend.result }}
          WEB_RESULT: ${{ needs.vnext-web.result }}
          LEGACY_PY_RESULT: ${{ needs.legacy-python.result }}
          LEGACY_WEB_RESULT: ${{ needs.legacy-web.result }}
        run: |
          printf 'architecture=%s\nbackend=%s\nweb=%s\nlegacy-python=%s\nlegacy-web=%s\n' \
            "$ARCHITECTURE_RESULT" "$BACKEND_RESULT" "$WEB_RESULT" "$LEGACY_PY_RESULT" "$LEGACY_WEB_RESULT"
          test "$ARCHITECTURE_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$LEGACY_PY_RESULT" = "success"
          test "$LEGACY_WEB_RESULT" = "success"
