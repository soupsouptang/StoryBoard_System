name: FRAMEFORGE CI

on:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "tools/**"
      - "storyboard-system/portable_project_export.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "tools/**"
      - "storyboard-system/portable_project_export.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ENVIRONMENT: "test"
  NEXT_TELEMETRY_DISABLED: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  architecture-boundaries:
    name: VNext package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce canonical root packages
        run: python tools/package_boundary_gate.py

  vnext-backend:
    name: VNext API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
      - name: Run API contract tests
        run: python -m pytest tests/backend -q

  vnext-web:
    name: VNext Web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install monorepo dependencies
        run: npm ci
      - name: Build shared packages
        run: |
          npm run build --workspace=@frameforge/contracts
          npm run build --workspace=@frameforge/timecode
          npm run build --workspace=@frameforge/types
          npm run build --workspace=@frameforge/ui
      - name: Build Next.js application
        run: npm run build --workspace=@frameforge/web

  portable-project-contract:
    name: Legacy portable export → VNext import contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the versioned synthetic file bridge
        run: python -m unittest tests.contracts.test_portable_project_contract -v

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - architecture-boundaries
      - vnext-backend
      - vnext-web
      - portable-project-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture-boundaries.result }}
          BACKEND_RESULT: ${{ needs.vnext-backend.result }}
          WEB_RESULT: ${{ needs.vnext-web.result }}
          PORTABLE_CONTRACT_RESULT: ${{ needs.portable-project-contract.result }}
        run: |
          printf 'architecture=%s\nbackend=%s\nweb=%s\nportable-contract=%s\n' \
            "$ARCHITECTURE_RESULT" "$BACKEND_RESULT" "$WEB_RESULT" "$PORTABLE_CONTRACT_RESULT"
          test "$ARCHITECTURE_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$PORTABLE_CONTRACT_RESULT" = "success"
