name: OpenAPI Compatibility

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".github/scripts/export_openapi.py"
      - ".github/scripts/openapi_diff_guard.py"
      - ".github/workflows/openapi-compatibility.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".github/scripts/export_openapi.py"
      - ".github/scripts/openapi_diff_guard.py"
      - ".github/workflows/openapi-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: No destructive OpenAPI regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -Eq '^0+$'; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: _base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            _base/apps/api/requirements.txt
      - name: Install base and head API dependencies
        run: |
          python -m pip install -r _base/apps/api/requirements.txt
          python -m pip install -r apps/api/requirements.txt
      - name: Generate base and head OpenAPI
        run: |
          mkdir -p qa-artifacts/openapi
          python .github/scripts/export_openapi.py --api-root _base/apps/api --output qa-artifacts/openapi/base.json
          python .github/scripts/export_openapi.py --api-root apps/api --output qa-artifacts/openapi/head.json
      - name: Reject destructive contract changes
        run: python .github/scripts/openapi_diff_guard.py --base qa-artifacts/openapi/base.json --head qa-artifacts/openapi/head.json
      - name: Upload contract evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-regression-${{ github.run_id }}
          path: qa-artifacts/openapi
          retention-days: 7
