name: API and Migration Contracts

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".frameforge/**"
      - ".github/scripts/openapi_contract_guard.py"
      - ".github/scripts/migration_state_guard.py"
      - ".github/workflows/api-contracts.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".frameforge/**"
      - ".github/scripts/openapi_contract_guard.py"
      - ".github/scripts/migration_state_guard.py"
      - ".github/workflows/api-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-state:
    name: Machine-readable migration evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python .github/scripts/migration_state_guard.py

  router-mutation-ratchet:
    name: Router mutation ownership ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python .github/scripts/router_mutation_guard.py

  openapi:
    name: Required OpenAPI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: "test"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python .github/scripts/openapi_contract_guard.py
