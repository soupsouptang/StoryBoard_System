name: API and Migration Contracts

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".frameforge/**"
      - ".github/scripts/openapi_contract_guard.py"
      - ".github/scripts/migration_state_guard.py"
      - ".github/workflows/api-contracts.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/api/**"
      - ".frameforge/**"
      - ".github/scripts/openapi_contract_guard.py"
      - ".github/scripts/migration_state_guard.py"
      - ".github/workflows/api-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-state:
    name: Machine-readable migration evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/scripts/migration_state_guard.py

  openapi:
    name: Required OpenAPI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python .github/scripts/openapi_contract_guard.py
