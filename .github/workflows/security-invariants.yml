name: Safety Invariants

on:
  push:
    branches: [master]
    paths:
      - "apps/api/app/core/config.py"
      - "apps/api/main.py"
      - "apps/api/app/models/**"
      - "apps/api/requirements-dev.lock"
      - "apps/api/pyproject.toml"
      - "apps/api/uv.lock"
      - "**/.env"
      - "**/.env.production"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/id_rsa"
      - "**/id_ed25519"
      - ".github/scripts/security_invariants.py"
      - ".github/workflows/security-invariants.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/api/app/core/config.py"
      - "apps/api/main.py"
      - "apps/api/app/models/**"
      - "apps/api/requirements-dev.lock"
      - "apps/api/pyproject.toml"
      - "apps/api/uv.lock"
      - "**/.env"
      - "**/.env.production"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/id_rsa"
      - "**/id_ed25519"
      - ".github/scripts/security_invariants.py"
      - ".github/workflows/security-invariants.yml"
  workflow_dispatch:

concurrency:
  group: safety-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    name: Fail-closed / AI zero-egress / Presence / credential guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install API dependencies
        run: python -m pip install --require-hashes -r apps/api/requirements-dev.lock
      - name: Verify safety invariants
        run: python .github/scripts/security_invariants.py
