name: Safety Invariants

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "storyboard-system/**"
      - "AGENTS.md"
      - ".github/scripts/security_invariants.py"
      - ".github/workflows/security-invariants.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/api/**"
      - "storyboard-system/**"
      - "AGENTS.md"
      - ".github/scripts/security_invariants.py"
      - ".github/workflows/security-invariants.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    name: Fail-closed / AI zero-egress / Presence / credential guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Verify safety invariants
        run: python .github/scripts/security_invariants.py
