name: PostgreSQL Migration Rehearsal

on:
  push:
    branches: [master]
    paths:
      - "apps/api/alembic/**"
      - "apps/api/alembic.ini"
      - "apps/api/app/models/**"
      - "apps/api/app/core/database.py"
      - "apps/api/app/core/config.py"
      - "apps/api/requirements-dev.lock"
      - "apps/api/pyproject.toml"
      - "apps/api/uv.lock"
      - "tools/postgres_rehearsal.py"
      - ".github/workflows/postgres-migration.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/api/alembic/**"
      - "apps/api/alembic.ini"
      - "apps/api/app/models/**"
      - "apps/api/app/core/database.py"
      - "apps/api/app/core/config.py"
      - "apps/api/requirements-dev.lock"
      - "apps/api/pyproject.toml"
      - "apps/api/uv.lock"
      - "tools/postgres_rehearsal.py"
      - ".github/workflows/postgres-migration.yml"
  workflow_dispatch:

concurrency:
  group: postgres-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-upgrade:
    name: Empty PostgreSQL -> Alembic head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frameforge
          POSTGRES_PASSWORD: frameforge_ci
          POSTGRES_DB: frameforge_ci_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frameforge -d frameforge_ci_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: "test"
      SECRET_KEY: "synthetic-postgres-ci-secret-key-only-not-for-use"
      DATABASE_URL: "postgresql+asyncpg://frameforge:frameforge_ci@127.0.0.1:5432/frameforge_ci_rehearsal"
      DATABASE_SYNC_URL: "postgresql+psycopg://frameforge:frameforge_ci@127.0.0.1:5432/frameforge_ci_rehearsal"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install API dependencies
        run: python -m pip install --require-hashes -r apps/api/requirements-dev.lock
      - name: Compile Alembic environment
        run: python -m py_compile apps/api/alembic/env.py
      - name: Upgrade fresh PostgreSQL database to head
        working-directory: apps/api
        run: python -m alembic -c alembic.ini upgrade head
      - name: Verify PostgreSQL ORM writes, constraints, locks and rollback
        run: python tools/postgres_rehearsal.py --disposable
      - name: Rehearse synthetic backup and recovery
        env:
          PGPASSWORD: frameforge_ci
        run: |
          pg_dump -h 127.0.0.1 -U frameforge -Fc frameforge_ci_rehearsal -f "$RUNNER_TEMP/rehearsal.dump"
          createdb -h 127.0.0.1 -U frameforge frameforge_restore_rehearsal
          pg_restore -h 127.0.0.1 -U frameforge -d frameforge_restore_rehearsal --exit-on-error "$RUNNER_TEMP/rehearsal.dump"
          DATABASE_URL="postgresql+asyncpg://frameforge:frameforge_ci@127.0.0.1:5432/frameforge_restore_rehearsal" \
          DATABASE_SYNC_URL="postgresql+psycopg://frameforge:frameforge_ci@127.0.0.1:5432/frameforge_restore_rehearsal" \
          python tools/postgres_rehearsal.py --disposable --verify-restored
