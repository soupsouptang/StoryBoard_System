name: PostgreSQL Migration Rehearsal

on:
  push:
    branches: [master]
    paths:
      - "apps/api/alembic/**"
      - "apps/api/alembic.ini"
      - "apps/api/app/models/**"
      - "apps/api/app/core/database.py"
      - "apps/api/app/core/config.py"
      - "apps/api/requirements.txt"
      - ".github/workflows/postgres-migration.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/api/alembic/**"
      - "apps/api/alembic.ini"
      - "apps/api/app/models/**"
      - "apps/api/app/core/database.py"
      - "apps/api/app/core/config.py"
      - "apps/api/requirements.txt"
      - ".github/workflows/postgres-migration.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 18 * * *"

permissions:
  contents: read

jobs:
  postgres-upgrade:
    name: Empty PostgreSQL -> Alembic head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frameforge
          POSTGRES_PASSWORD: frameforge_ci
          POSTGRES_DB: frameforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frameforge -d frameforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: "test"
      DATABASE_URL: "postgresql+asyncpg://frameforge:frameforge_ci@127.0.0.1:5432/frameforge_ci"
      DATABASE_SYNC_URL: "postgresql+psycopg://frameforge:frameforge_ci@127.0.0.1:5432/frameforge_ci"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Compile Alembic environment
        run: python -m py_compile apps/api/alembic/env.py
      - name: Prepare PostgreSQL diagnostics
        run: mkdir -p .artifacts/postgres
      - name: Require exactly one Alembic head
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          HEADS="$(python -m alembic -c alembic.ini heads 2>&1 | tee -a ../../.artifacts/postgres/alembic.log)"
          COUNT="$(printf '%s\n' "$HEADS" | grep -c '(head)' || true)"
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $COUNT" | tee -a ../../.artifacts/postgres/alembic.log
            exit 1
          fi
      - name: Upgrade fresh PostgreSQL database to head
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          python -m alembic -c alembic.ini upgrade head 2>&1 | tee -a ../../.artifacts/postgres/alembic.log
      - name: Reject SQLAlchemy / Alembic schema drift
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          python -m alembic -c alembic.ini check 2>&1 | tee -a ../../.artifacts/postgres/alembic.log
      - name: Verify isolated downgrade and re-upgrade
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          python -m alembic -c alembic.ini downgrade base 2>&1 | tee -a ../../.artifacts/postgres/alembic.log
          python -m alembic -c alembic.ini upgrade head 2>&1 | tee -a ../../.artifacts/postgres/alembic.log
      - name: Verify canonical tables and Alembic version
        working-directory: apps/api
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          from app.core.config import settings

          engine = create_engine(settings.DATABASE_SYNC_URL)
          with engine.connect() as connection:
              tables = set(inspect(connection).get_table_names())
              required = {"alembic_version", "users", "productions", "shots", "audit_logs"}
              missing = sorted(required - tables)
              if missing:
                  raise SystemExit(f"missing migrated tables: {missing}")
              revision = connection.execute(text("select version_num from alembic_version")).scalar_one()
              if not revision:
                  raise SystemExit("alembic_version is empty")
              print(f"PASS: PostgreSQL migrated to {revision}; {len(tables)} tables present")
          engine.dispose()
          PY

      - name: Upload PostgreSQL migration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-migration-diagnostics
          path: .artifacts/postgres/
          if-no-files-found: ignore
          retention-days: 14
