version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      vnext-js:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/storyboard-system"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      legacy-js:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
