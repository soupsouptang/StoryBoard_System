version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frameforge-root-npm:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/storyboard-system"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frameforge-legacy-npm:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frameforge-api-python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/storyboard-system"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frameforge-legacy-python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
