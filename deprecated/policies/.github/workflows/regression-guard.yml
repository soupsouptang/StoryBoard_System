name: Regression Guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Constitution and product regression guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -Eq '^0+$'; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - name: Enforce stable constitution, parity inventory and deletion policy
        run: python .github/scripts/regression_guard.py --base "${{ steps.base.outputs.sha }}"

  python-syntax:
    name: Python syntax guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile canonical and migration Python sources
        shell: bash
        run: |
          python -m compileall -q apps/api
          python -m compileall -q storyboard-system/fastapi_app
          python -m compileall -q storyboard-system/repositories
          python -m compileall -q storyboard-system/tools
          find storyboard-system -maxdepth 1 -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile
