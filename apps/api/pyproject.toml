[project]
name = "frameforge-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.121.0",
    "fonttools[woff]>=4.0,<5",
    "openpyxl>=3.1.5",
    "onnxruntime>=1.20,<2",
    "Pillow>=12.0.0,<13",
    "psycopg[binary]>=3.2.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=6.0.0,<7",
    "pypdfium2>=5.0.0,<6",
    "python-docx>=1.2.0,<2",
    "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.10.0,<3",
    "rapidocr>=3.9.0,<4",
    "redis>=5.0.0",
    "reportlab>=4.0.0,<6",
    "rq>=2.0.0,<3",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
