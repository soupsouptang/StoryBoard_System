<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
 <title id="title">通告纸张与个人手机阅读视图</title><desc id="desc">合成通告的纸张信息层级和个人阅读摘要。同一个不可变发布修订，查看确认到场分开。不是可直接打印的正式模板。</desc>
 <rect width="1440" height="1000" fill="#171717"/><g font-family="Microsoft YaHei, sans-serif">
 <text x="60" y="51" fill="#fafafa" font-size="23">通告规划 · 同一发布修订，按权限投影</text><text x="60" y="85" fill="#aaa" font-size="15">纸张示意为合成数据；实际模板使用毫米排版并单独验收。</text>
 <rect x="60" y="117" width="595" height="842" fill="#fff"/>
 <g fill="#202020"><text x="95" y="164" font-size="22" font-weight="700">城市影像 · 拍摄通告</text><text x="95" y="197" font-size="14">拍摄日 1　｜　2026-10-05　｜　摄制组 1</text><text x="95" y="225" font-size="12">发布修订 2 · 当地时间 Asia/Shanghai · 示例正文</text><path d="M95 245H620" stroke="#222"/>
 <text x="95" y="283" font-size="19" font-weight="700">个人集合时间按接收人显示</text><text x="95" y="315" font-size="14">工作人员准备 08:00　｜　演员 A 妆发 08:30</text><text x="95" y="345" font-size="14">摄影开机 09:00　｜　预计收工 18:00</text>
 <rect x="95" y="368" width="525" height="84" fill="#f1f1f1"/><text x="110" y="397" font-size="14" font-weight="700">地点与准备</text><text x="110" y="426" font-size="13">地点 A · 入口与集合点由授权来源填写；缺项标明待确认</text>
 <text x="95" y="490" font-size="17" font-weight="700">当天安排</text><rect x="95" y="506" width="525" height="34" fill="#ececec"/><text x="110" y="529" font-size="12">时间　　　　　　场景 / 镜头　　　　　地点　　　　　准备</text>
 <text x="110" y="571" font-size="13">08:00—09:00　　场景准备　　　　　地点 A　　　　搭建</text><path d="M95 586H620" stroke="#ddd"/>
 <text x="110" y="616" font-size="13">09:00—11:00　　场景 A · 001/002　 地点 A　　　　道具 A</text><path d="M95 632H620" stroke="#ddd"/>
 <text x="110" y="663" font-size="13">11:00—12:00　　转场　　　　　　　A → B　　　 分段时间</text><path d="M95 678H620" stroke="#ddd"/>
 <text x="95" y="721" font-size="16" font-weight="700">人员与授权联络信息</text><text x="95" y="751" font-size="13">只列本次允许字段；敏感联系信息不默认铺开</text><text x="95" y="795" font-size="16" font-weight="700">与上次发布的变化</text><text x="95" y="825" font-size="13">集合点更新；旧确认仍属于修订 1</text><path d="M95 895H620" stroke="#ddd"/><text x="95" y="922" font-size="12">发布修订 2 · 授权副本　　　　　　　　　　　　　　1 / 1</text></g>
 <rect x="810" y="153" width="420" height="758" rx="32" fill="#0b0b0b" stroke="#777" stroke-width="2"/>
 <g fill="#fafafa"><text x="836" y="200" font-size="14">← 个人通告</text><text x="836" y="251" font-size="22" font-weight="700">今天 · 拍摄日 1</text><text x="836" y="282" font-size="14" fill="#aaa">成员 A · 摄制组 1 · 发布修订 2</text>
 <rect x="834" y="307" width="370" height="129" rx="14" fill="#242424"/><text x="852" y="341" font-size="14" fill="#bbb">你的集合时间</text><text x="852" y="384" font-size="32" font-weight="700">08:30</text><text x="852" y="414" font-size="15">地点 A · 集合点待确认</text>
 <text x="836" y="478" font-size="17">先做什么</text><text x="836" y="511" font-size="14" fill="#bbb">妆发 → 场景 A 拍摄 → 转场</text><text x="836" y="561" font-size="17">需要准备</text><text x="836" y="594" font-size="14" fill="#bbb">查看本次授权的个人准备清单</text>
 <rect x="834" y="624" width="370" height="85" rx="10" fill="#202938"/><text x="850" y="658" font-size="14">修订 2：集合点已变化</text><text x="850" y="687" font-size="13" fill="#bbc9df">你对修订 1 的确认仍保留</text>
 <text x="836" y="756" font-size="13" fill="#aaa">查看 ≠ 确认 ≠ 到场</text><rect x="834" y="786" width="370" height="48" rx="10" fill="#fafafa"/><text x="897" y="817" fill="#171717" font-size="16">确认我已阅读修订 2</text><text x="836" y="874" font-size="12" fill="#aaa">需要服务器回执，不作离线已确认</text></g>
 </g>
</svg>
