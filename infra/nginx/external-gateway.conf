# ==============================================================================

map $http_upgrade $external_connection_upgrade {
    default upgrade;
    ''      close;
}
# FrameForge OS - External Zero-Residency Gateway Configuration
# Master Specification Section 3 & 10 Implementation
# ==============================================================================
# Requirements:
# 1. Zero data residency: No project data, tokens, session cookies in access logs.
# 2. L4 / L7 TLS Passthrough & stateless stream forwarding to internal connector.
# 3. High throughput streaming without disk buffering.
# ==============================================================================

# Sanitized log format that excludes sensitive query parameters, tokens, and bodies
log_format zero_residency '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent"';

server {
    listen 80;
    server_name studio.company.com review.company.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name studio.company.com review.company.com;

    # SSL Configuration (Terminated or passed through)
    ssl_certificate /etc/nginx/ssl/external.crt;
    ssl_certificate_key /etc/nginx/ssl/external.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Zero-Residency Access Logging
    access_log /var/log/nginx/external_access.log zero_residency;
    error_log /var/log/nginx/external_error.log warn;

    # Upload buffer settings - In-memory streaming without disk temp files
    client_max_body_size 400M;
    client_body_buffer_size 128k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    # Proxy to Internal Company Connector
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $external_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large video / zip streams
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Error Page when internal server is offline / disconnected
    error_page 502 503 504 /gateway_offline.html;
    location = /gateway_offline.html {
        root /usr/share/nginx/html;
        internal;
    }
}
