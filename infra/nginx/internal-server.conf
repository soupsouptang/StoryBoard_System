# ==============================================================================
# FrameForge OS - Internal Company Server Gateway Configuration
# Master Specification Section 3 Implementation
# ==============================================================================

map $http_upgrade $internal_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_frontend {
    server 127.0.0.1:3000;
}

upstream api_backend {
    server 127.0.0.1:8000;
}

upstream minio_storage {
    server 127.0.0.1:9000;
}

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 400M;
    client_body_buffer_size 512k;

    # Gzip Compression for local network optimization
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. API Backend Routing
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Public / Health Check
    location /healthz {
        proxy_pass http://api_backend/healthz;
    }

    # FastAPI mounts its presence WebSocket at /ws/presence/{production_id}.
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $internal_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Media Proxy / Storage
    location /media/ {
        proxy_pass http://api_backend/media/;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 4. Next.js Web App Frontend
    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $internal_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
